---
apiVersion: v1
kind: Pod
metadata:
  name: perl-data-prepare
  namespace: osdb-mcdb
  labels:
    role: pgsql-client
spec:
  containers:
    - command:
        - tail
        - -f
        - /dev/null
      env:
        - name: PSQL_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              key: connection-string
              name: pgsql-postgresqladmin
      image: artifacts.open.ch/public-docker-virtual/georgmoser/ora2pg:latest
      imagePullPolicy: IfNotPresent
      name: pgsql
      ports:
        - containerPort: 5432
          protocol: TCP
      volumeMounts:
        - mountPath: /data/data_output
          name: ora2pg-output
          readOnly: false
        - name: job-config
          mountPath: /job-config
        - mountPath: /config-template
          name: config-volume
  volumes:
    - name: ora2pg-output
      persistentVolumeClaim:
        claimName: ora2pg-output
    - name: job-config
      configMap:
        name: data-other-job-items
        defaultMode: 420
    - configMap:
        defaultMode: 420
        name: tnsnames-config
      name: config-volume
  restartPolicy: Always
  