---
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-nids-clob-job-items
  namespace: osdb-mcdb
data:


  # file format
  schema.names: |
    NIDS

  schema.dirs: |
    NIDS_CLOB

  ora2pg.conf: |
    # Oracle to PostgreSQL migration configuration file for MCAUDIT schema
    # 40 parallel extraction processes => 1 Mio Rec / 10min. <= 1vCPU , 1.2GB RAM
    ORACLE_COPIES 40
    TRUNCATE_TABLE 1
    DEFINED_PK SIGNATURE:id
    ALLOW SIGNATURE
    
