---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    job-name: mcdb-import-data-bulk-other
  name: mcdb-import-data-bulk-other
  namespace: osdb-mcdb
spec:
  backoffLimit: 16
  completions: 3
  parallelism: 6
  completionMode: Indexed
  podReplacementPolicy: TerminatingOrFailed
  suspend: false
  template:
    spec:
      initContainers:
        - name: choose-schema
          image: 'docker.io/library/bash'
          volumeMounts:
            - mountPath: /config-template
              name: config-volume
            - name: my-config
              mountPath: /config
            - name: job-config
              mountPath: /job-config
            - name: job-command
              mountPath: /job-command
            - mountPath: /data/data_output
              name: ora2pg-output
          command:
            - "bash"
            - "-c"
            - |
              cp /config-template/*.* /config
              source /job-command/import_command_line
      containers:
        - command:
            - "sh"
            - "/config/command_line"
          env:
          - name: PSQL_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                key: connection-string
                name: pgsql-postgresqladmin
          image: artifacts.open.ch/public-docker-virtual/alpine/psql
          imagePullPolicy: Always
          name: plsql-import
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
            requests:
              cpu: "1"
              memory: "500Mi"
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /data/data_output
              name: ora2pg-output
            - name: my-config
              mountPath: /config
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: ora2pg-output
          persistentVolumeClaim:
            claimName: ora2pg-output
        - configMap:
            defaultMode: 420
            name: tnsnames-config
          name: config-volume
        - name: job-config
          configMap:
            name: data-bulk-import-job-items
            defaultMode: 420
        - name: job-command
          configMap:
            name: data-initcontainer-command-line
            defaultMode: 420
        - name: my-config
          emptyDir: {}