---
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-tt-job-items
  namespace: osdb-mcdb
data:


  # file format
  schema.names: |
    TT

  schema.dirs: |
    TT_INSERT

# file format
  ora2pg.conf: |
    # Additional Oracle to PostgreSQL migration configuration file for TT schema
    # ORACLE_COPIES is the number of parallel extraction processes
    ORACLE_COPIES 20
    # Exclude specific tables from the migration
    # EXCLUDE EVENT
    # Alternatively: you can exclude all older event than a cutoff date - and load these later.
    WHERE EVENT[EVENTDATE >= DATE'2025-07-14']
    WHERE TICKET[OPEN_DATE >= DATE'2025-07-14']
#      printf "\n EXCLUDE TODO_ITEM TICKET EVENT_TYPE_MESSAGE SERVICE_WINDOW CHANGE_REQUEST EVENT TODO_LIST_TEMPLATE" >> /config/data_export.conf
