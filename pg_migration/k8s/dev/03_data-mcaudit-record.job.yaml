---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    job-name: mcdb-export-data-mcaudit-record
  name: mcdb-export-data-mcaudit-record
  namespace: osdb-mcdb
spec:
  backoffLimit: 6
  completions: 1
  parallelism: 1
  completionMode: Indexed
  podReplacementPolicy: TerminatingOrFailed
  suspend: false
  template:
    spec:
      initContainers:
        - name: choose-schema
          image: 'docker.io/library/bash'
          volumeMounts:
            - mountPath: /config-template
              name: config-volume
            - name: my-config
              mountPath: /config
            - name: job-config
              mountPath: /job-config
            - name: job-command
              mountPath: /job-command
            - mountPath: /data/data_output
              name: ora2pg-output
          command:
            - "bash"
            - "-c"
            - |
              cp /config-template/*.* /config
              source /job-command/fixed_basedir_command_line
          env:
            - name: OUTPUT_LOCATION
              value: /data/data_output/MCAUDIT_BULK
            - name: TYPE
              value: COPY
      containers:
        - command:
            - "sh"
            - "/config/command_line"
          env:
            - name: CONFIG_LOCATION
              value: /config/data_export.conf
            - name: TNS_ADMIN
              value: /config
            - name: ORACLE_HOST
              value: dbi:Oracle:ORADVRO
            - name: ORA2PG_PASSWD
              valueFrom:
                secretKeyRef:
                  key: key
                  name: db-password-ora
          image: artifacts.open.ch/public-docker-virtual/georgmoser/ora2pg:latest
          imagePullPolicy: Always
          name: ora2pg
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "2"
              memory: "1Gi"
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /data/data_output
              name: ora2pg-output
            - name: my-config
              mountPath: /config
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: ora2pg-output
          persistentVolumeClaim:
            claimName: ora2pg-output
        - configMap:
            defaultMode: 420
            name: tnsnames-config
          name: config-volume
        - name: job-config
          configMap:
            name: data-mcaudit-record-job-items
            defaultMode: 420
        - name: job-command
          configMap:
            name: data-initcontainer-command-line
            defaultMode: 420
        - name: my-config
          emptyDir: {}