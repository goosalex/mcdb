---
apiVersion: v1
kind: Pod
metadata:
  name: pgsql-client
  labels:
    role: pgsql-client
spec:
  containers:
    - command:
        - tail
        - -f
        - /dev/null
      env:
        - name: PSQL_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              key: connection-string
              name: external-pgsql-adminsecret
      image: artifacts.open.ch/public-docker-virtual/alpine/psql
      imagePullPolicy: IfNotPresent
      name: pgsql
      ports:
        - containerPort: 5432
          protocol: TCP
      volumeMounts:
        - mountPath: /data/data_output
          name: ora2pg-output
          readOnly: false
  volumes:
    - name: ora2pg-output
      persistentVolumeClaim:
        claimName: ora2pg-output
  restartPolicy: Always
  